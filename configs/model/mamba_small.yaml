# @package _global_

model:
  name: mamba
  params:
    d_model: 256           # Smaller model for faster training
    d_state: 16            # SSM state expansion factor
    d_conv: 4              # Local convolution width
    expand: 2              # SSM block expansion factor
    n_layers: 1            # Number of Mamba layers
    ffn_dim: 1024          # Reduced FFN dimension
    dropout: 0.1           # Dropout probability
    norm_type: "layer"     # Normalization type
