name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }} - ${{ matrix.test-slice }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        test-slice: ["core", "data"]
        include:
          - test-slice: core
            pytest-args: "tests/test_models.py tests/test_transforms.py"
          - test-slice: data
            pytest-args: "tests/data"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache virtual environment
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Activate venv for subsequent steps
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Cache pytest and mypy state
        uses: actions/cache@v4
        with:
          path: |
            .pytest_cache
            .mypy_cache
          key: caches-${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.test-slice }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            caches-${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.test-slice }}-
            caches-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Run linting with ruff
        run: |
          ruff check src/ tests/
        continue-on-error: true

      - name: Run type checking with mypy
        run: |
          mypy src/airtrace/
        continue-on-error: true

      - name: Run tests with pytest
        env:
          COVERAGE_FILE: ".coverage.py${{ replace(matrix.python-version, '.', '') }}.${{ matrix.test-slice }}"
        run: |
          pytest -n auto --dist=loadfile ${{ matrix.pytest-args }} --cov=airtrace --cov-report=xml:coverage-${{ matrix.python-version }}-${{ matrix.test-slice }}.xml --cov-report=term

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}-${{ matrix.test-slice }}
          path: |
            coverage-${{ matrix.python-version }}-${{ matrix.test-slice }}.xml
            .coverage.py${{ replace(matrix.python-version, '.', '') }}.${{ matrix.test-slice }}
          retention-days: 30

  aggregate-test-coverage:
    name: Aggregate Test Coverage
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coverage tooling
        run: |
          python -m pip install --upgrade pip
          pip install "coverage[toml]>=7.3"

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts
          pattern: coverage-py*
          merge-multiple: true

      - name: Combine coverage results
        run: |
          python - <<'PYTHON_SCRIPT'
          import io
          import os
          import sys
          from pathlib import Path

          try:
              from coverage import Coverage
          except ImportError as exc:
              print(f"Failed to import coverage: {exc}", file=sys.stderr)
              sys.exit(1)

          artifacts_dir = Path("coverage-artifacts")
          if not artifacts_dir.exists():
              print("No coverage artifacts directory found; skipping aggregation.")
              sys.exit(0)

          data_files = sorted(artifacts_dir.glob(".coverage.*"))
          if not data_files:
              print("No coverage data files found; skipping aggregation.")
              sys.exit(0)

          grouped = {}
          for data_file in data_files:
              parts = data_file.name.split(".")
              if len(parts) < 4:
                  # Expected format: .coverage.py<python><...>.<slice>
                  continue
              _, coverage_label, python_version, test_slice = parts[0], parts[1], parts[2], parts[3]
              if coverage_label != "coverage":
                  continue
              grouped.setdefault(python_version, []).append((test_slice, data_file))

          if not grouped:
              print("No parsable coverage data files found; skipping aggregation.")
              sys.exit(0)

          summary_path = Path(os.environ.get("GITHUB_STEP_SUMMARY", "coverage-summary.md"))
          output_dir = Path("coverage-output")
          output_dir.mkdir(exist_ok=True)

          def _format_python_label(tag: str) -> str:
              if not tag.startswith("py"):
                  return tag
              numeric = tag[2:]
              if len(numeric) == 2:
                  display = f"{numeric[0]}.{numeric[1]}"
              elif len(numeric) > 2:
                  display = f"{numeric[0]}.{numeric[1:]}"
              else:
                  display = numeric
              return f"Python {display}"

          def _sort_key(tag: str):
              numeric = tag[2:] if tag.startswith("py") else tag
              if len(numeric) >= 2 and numeric.isdigit():
                  major = int(numeric[0])
                  minor = int(numeric[1:]) if len(numeric) > 1 else 0
                  return (major, minor)
              return (numeric, )

          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("## Aggregated Test Coverage\n\n")
              summary.write("| Python | Total Coverage |\n")
              summary.write("|--------|----------------|\n")

              for python_version in sorted(grouped, key=_sort_key):
                  entries = grouped[python_version]
                  data_paths = [str(path) for _, path in entries]

                  cov = Coverage(data_file=str(output_dir / f".coverage.{python_version}.combined"))
                  cov.combine(data_paths)
                  cov.save()
                  cov.load()

                  report_stream = io.StringIO()
                  total_coverage = cov.report(file=report_stream)
                  report_text = report_stream.getvalue()
                  (output_dir / f"coverage-report-{python_version}.txt").write_text(report_text, encoding="utf-8")

                  cov.xml_report(outfile=str(output_dir / f"coverage-combined-{python_version}.xml"))

                  summary.write(f"| {_format_python_label(python_version)} | {total_coverage:.2f}% |\n")

          print("Combined coverage reports written to", output_dir)
          PYTHON_SCRIPT

      - name: Upload aggregated coverage
        if: ${{ success() && hashFiles('coverage-output/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage
          path: coverage-output
          retention-days: 30

  model-validation:
    name: Model Validation (${{ matrix.model-group }})
    runs-on: ubuntu-latest
    needs: test  # Only run if tests pass
    strategy:
      fail-fast: false
      matrix:
        model-group: ["recurrent", "temporal-conv", "trend-baselines", "advanced-baselines"]
        include:
          - model-group: recurrent
            model-list: "gru_ar,lstm_ar,gru_seq2seq,lstm_seq2seq"
          - model-group: temporal-conv
            model-list: "tcn,transformer,patchtst,itransformer,timemixer,cyclenet"
          - model-group: trend-baselines
            model-list: "persistence,moving_average,zero,mean,median,drift,linear_trend"
          - model-group: advanced-baselines
            model-list: "exponential_smoothing,seasonal_naive,polynomial_trend,holt_linear_trend,theta,sarima,var,linear_ar,mlp_ar"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache virtual environment
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.10-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.10-

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Activate venv for subsequent steps
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Create data directories
        run: |
          mkdir -p data/raw
          mkdir -p data/interim
          mkdir -p data/processed

      - name: Run model validation
        id: validate
        run: |
          python src/scripts/validate_models.py \
            --output model_validation_results_${{ matrix.model-group }}.json \
            --models "${{ matrix.model-list }}" \
            --seed 42 \
            --n-flights 20 \
            --n-epochs 10 \
            --batch-size 32 \
            --device cpu

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-results-${{ matrix.model-group }}
          path: model_validation_results_${{ matrix.model-group }}.json
          retention-days: 30

  aggregate-model-validation:
    name: Aggregate Model Validation
    runs-on: ubuntu-latest
    needs: model-validation
    if: ${{ always() }}

    steps:
      - name: Download validation artifacts
        uses: actions/download-artifact@v4
        with:
          path: model-validation-artifacts
          pattern: model-validation-results-*
          merge-multiple: true

      - name: Combine validation results
        run: |
          python3 <<'PYTHON_SCRIPT'
          import json
          import os
          import sys
          from pathlib import Path

          artifacts_dir = Path("model-validation-artifacts")
          if not artifacts_dir.exists():
              print("No validation artifacts found; skipping aggregation.")
              sys.exit(0)

          result_files = sorted(artifacts_dir.glob("model_validation_results_*.json"))
          if not result_files:
              print("No validation result files located; skipping aggregation.")
              sys.exit(0)

          combined = None
          for file_path in result_files:
              with file_path.open("r", encoding="utf-8") as handle:
                  data = json.load(handle)

              if combined is None:
                  combined = data
                  combined["results"] = []
              else:
                  for key in [
                      "seed",
                      "n_flights",
                      "n_epochs",
                      "batch_size",
                      "device",
                      "input_dim",
                      "output_dim",
                      "train_samples",
                      "val_samples",
                  ]:
                      if key in data and key in combined and combined[key] != data[key]:
                          print(f"Warning: value mismatch for '{key}' across shards", file=sys.stderr)

              combined["results"].extend(data.get("results", []))

          if combined is None:
              print("Combined data is empty; skipping aggregation.")
              sys.exit(0)

          combined["results"].sort(key=lambda item: item.get("model_name", ""))

          output_path = Path("model_validation_results_combined.json")
          with output_path.open("w", encoding="utf-8") as handle:
              json.dump(combined, handle, indent=2)

          summary_path = Path(os.environ.get("GITHUB_STEP_SUMMARY", "model-validation-summary.md"))
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("## Model Validation Results\n\n")
              summary.write("### Configuration\n\n")
              summary.write(f"- **Seed**: {combined.get('seed')}\n")
              summary.write(f"- **Flights**: {combined.get('n_flights')}\n")
              summary.write(f"- **Epochs**: {combined.get('n_epochs')}\n")
              summary.write(f"- **Train Samples**: {combined.get('train_samples')}\n")
              summary.write(f"- **Val Samples**: {combined.get('val_samples')}\n\n")

              summary.write("### Results\n\n")
              summary.write("| Model | Status | Params | Train Time | RMSE | MAE | R² |\n")
              summary.write("|-------|--------|--------|------------|------|-----|----|\n")

              n_success = 0
              first_success = None
              for result in combined["results"]:
                  model_name = result.get("model_name", "unknown")
                  status = result.get("status", "unknown")

                  if status == "success":
                      n_success += 1
                      n_params = f"{result.get('n_params', 0):,}"
                      train_time = f"{result.get('train_time', 0.0):.2f}s"
                      metrics = result.get("overall_metrics", {})
                      rmse = f"{metrics.get('rmse', float('nan')):.4f}"
                      mae = f"{metrics.get('mae', float('nan')):.4f}"
                      r2 = f"{metrics.get('r2', float('nan')):.4f}"
                      summary.write(f"| {model_name} | ✅ PASS | {n_params} | {train_time} | {rmse} | {mae} | {r2} |\n")
                      if first_success is None:
                          first_success = result
                  else:
                      summary.write(f"| {model_name} | ❌ FAIL | - | - | - | - | - |\n")
                      error_message = result.get("error")
                      if error_message:
                          summary.write(f"\n**Error**: {error_message}\n\n")

              n_total = len(combined["results"])
              success_rate = (n_success / n_total * 100) if n_total else 0.0
              summary.write(f"\n**Success Rate**: {n_success}/{n_total} ({success_rate:.1f}%)\n\n")

              if first_success is not None:
                  summary.write("### Per-Sensor Metrics (First Successful Model)\n\n")
                  summary.write(f"**{first_success.get('model_name')}**:\n\n")
                  summary.write("| Sensor | RMSE | MAE | R² |\n")
                  summary.write("|--------|------|-----|----|\n")
                  for sensor, metrics in first_success.get("sensor_metrics", {}).items():
                      summary.write(
                          f"| {sensor} | {metrics.get('rmse', float('nan')):.4f} | {metrics.get('mae', float('nan')):.4f} | {metrics.get('r2', float('nan')):.4f} |\n"
                      )

          print(f"Combined results written to {output_path}")
          PYTHON_SCRIPT

      - name: Upload combined validation results
        if: ${{ success() && hashFiles('model_validation_results_combined.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-results-combined
          path: model_validation_results_combined.json
          retention-days: 30

