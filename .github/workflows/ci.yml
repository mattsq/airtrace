name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache virtual environment
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Activate venv for subsequent steps
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Run linting with ruff
        run: |
          ruff check src/ tests/
        continue-on-error: true

      - name: Run type checking with mypy
        run: |
          mypy src/airtrace/
        continue-on-error: true

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=airtrace --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

      - name: Display coverage summary
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    needs: test  # Only run if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache virtual environment
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.10-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.10-

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Activate venv for subsequent steps
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Create data directories
        run: |
          mkdir -p data/raw
          mkdir -p data/interim
          mkdir -p data/processed

      - name: Determine models to validate
        id: detect-models
        run: |
          # Fetch the base branch for comparison
          git fetch origin main --depth=50 || true

          # Determine which models need validation based on changes
          # This script detects changed model configs/implementations and always includes baseline models
          MODELS=$(python src/scripts/get_models_to_validate.py --base-ref origin/main)

          echo "models=$MODELS" >> $GITHUB_OUTPUT

          if [ -n "$MODELS" ]; then
            echo "📝 Selective validation: $MODELS"
          else
            echo "📝 Full validation (no model filter)"
          fi

      - name: Run model validation
        id: validate
        run: |
          if [ -n "${{ steps.detect-models.outputs.models }}" ]; then
            echo "Running selective model validation..."
            python src/scripts/validate_models.py \
              --output model_validation_results.json \
              --seed 42 \
              --n-flights 20 \
              --n-epochs 10 \
              --batch-size 32 \
              --device cpu \
              --models ${{ steps.detect-models.outputs.models }}
          else
            echo "Running full model validation..."
            python src/scripts/validate_models.py \
              --output model_validation_results.json \
              --seed 42 \
              --n-flights 20 \
              --n-epochs 10 \
              --batch-size 32 \
              --device cpu
          fi

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-results
          path: model_validation_results.json
          retention-days: 30

      - name: Parse and display results
        if: always()
        run: |
          echo "## Model Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse JSON and create markdown table
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          import sys

          try:
              with open("model_validation_results.json", "r") as f:
                  data = json.load(f)

              # Write to GitHub step summary
              with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout"), "a") as summary:
                  summary.write("### Configuration\n\n")
                  summary.write(f"- **Seed**: {data['seed']}\n")
                  summary.write(f"- **Flights**: {data['n_flights']}\n")
                  summary.write(f"- **Epochs**: {data['n_epochs']}\n")
                  summary.write(f"- **Train Samples**: {data['train_samples']}\n")
                  summary.write(f"- **Val Samples**: {data['val_samples']}\n\n")

                  summary.write("### Results\n\n")
                  summary.write("| Model | Status | Params | Train Time | RMSE | MAE | R² |\n")
                  summary.write("|-------|--------|--------|------------|------|-----|----|\n")

                  n_success = 0
                  for result in data["results"]:
                      model_name = result["model_name"]
                      status = result["status"]

                      if status == "success":
                          n_success += 1
                          n_params = f"{result['n_params']:,}"
                          train_time = f"{result['train_time']:.2f}s"
                          rmse = f"{result['overall_metrics']['rmse']:.4f}"
                          mae = f"{result['overall_metrics']['mae']:.4f}"
                          r2 = f"{result['overall_metrics']['r2']:.4f}"

                          summary.write(f"| {model_name} | ✅ PASS | {n_params} | {train_time} | {rmse} | {mae} | {r2} |\n")
                      else:
                          summary.write(f"| {model_name} | ❌ FAIL | - | - | - | - | - |\n")
                          summary.write(f"\n**Error**: {result.get('error', 'Unknown error')}\n\n")

                  n_total = len(data["results"])
                  success_rate = (n_success / n_total * 100) if n_total > 0 else 0

                  summary.write(f"\n**Success Rate**: {n_success}/{n_total} ({success_rate:.1f}%)\n\n")

                  # Sensor-specific metrics for successful models
                  summary.write("### Per-Sensor Metrics (First Successful Model)\n\n")
                  for result in data["results"]:
                      if result["status"] == "success":
                          model_name = result["model_name"]
                          sensor_metrics = result["sensor_metrics"]

                          summary.write(f"**{model_name}**:\n\n")
                          summary.write("| Sensor | RMSE | MAE | R² |\n")
                          summary.write("|--------|------|-----|----|\n")

                          for sensor, metrics in sensor_metrics.items():
                              rmse = f"{metrics['rmse']:.4f}"
                              mae = f"{metrics['mae']:.4f}"
                              r2 = f"{metrics['r2']:.4f}"
                              summary.write(f"| {sensor} | {rmse} | {mae} | {r2} |\n")

                          summary.write("\n")
                          break  # Only show first successful model

          except Exception as e:
              print(f"Error parsing results: {e}", file=sys.stderr)
              sys.exit(0)  # Don't fail the job on parsing errors
          PYTHON_SCRIPT

      - name: Check validation success
        run: |
          # Fail the job if any model failed validation
          if grep -q '"status": "failed"' model_validation_results.json; then
            echo "❌ One or more models failed validation"
            exit 1
          else
            echo "✅ All models passed validation"
          fi
