# @package _global_
# NOTE: This config does NOT include context features (static metadata like aircraft_type, route_length).
# If you need context features, use 'zscore_diff_with_context.yaml' instead.
# This change was made in 2025-11-28 to make the default transform behavior more explicit.

transforms:
  pipeline:
    - name: zscore
      per_sensor: true
      center: true
      scale: true
    - name: diff
      sensors: ["fuel_flow"]
      order: 1
