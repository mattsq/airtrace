# @package _global_

train:
  batch_size: 32  # Smaller batch size for longer sequences
  epochs: 100
  num_workers: 8

  optimizer:
    name: adam
    lr: 5e-4
    weight_decay: 1e-5
    betas: [0.9, 0.999]

  scheduler:
    name: cosine
    warmup_epochs: 5
    min_lr: 1e-7

  # Early stopping
  early_stopping:
    patience: 15
    min_delta: 1e-4
    monitor: val_loss
    mode: min

  # Checkpointing
  checkpoint:
    save_top_k: 3
    monitor: val_loss
    mode: min

  # Gradient clipping (more aggressive for long sequences)
  grad_clip:
    enabled: true
    max_norm: 0.5

  # Logging
  log_every_n_steps: 100
  val_check_interval: 1.0
  shuffle:
    strategy: block
    block_size: 32768  # Smaller block keeps memory modest for long contexts
