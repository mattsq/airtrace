# @package _global_

data:
  root: data/
  dataset_name: "synthetic"
  train_index: "metadata/synthetic_train_index.parquet"
  val_index: "metadata/synthetic_val_index.parquet"
  test_index: "metadata/synthetic_test_index.parquet"

  window:
    input_len: 128
    pred_len: 16
    stride: 16
    target_sensors: ["fuel_flow", "mach", "n1"]

  sensors:
    use: ["fuel_flow", "mach", "altitude", "oat", "n1"]

  static_features:
    use: []

  # Generation parameters (used by synthetic generator)
  generation:
    n_flights: 20
    seed: 42
    train_val_test_split: [0.7, 0.15, 0.15]

    # Cruise profile parameters (simplified for generic signals)
    cruise_profile:
      initial_altitude: 35000.0      # feet
      initial_mach: 0.80             # Mach number
      initial_weight: 65000.0        # kg
      cruise_duration: 1800          # seconds (30 minutes)
      fuel_flow_base: 2200.0         # kg/hour
      n1_base: 82.0                  # percent
      sample_rate: 1.0               # Hz

      # Variation parameters
      altitude_variation: 100.0      # feet
      mach_variation: 0.01           # Mach
      turbulence_level: 0.1          # 0-1 scale

      # Noise levels
      fuel_flow_noise: 0.01          # relative std dev
      mach_noise: 0.005              # absolute std dev
      altitude_noise: 10.0           # feet std dev
      n1_noise: 0.5                  # percent std dev
      oat_noise: 1.0                 # Celsius std dev
