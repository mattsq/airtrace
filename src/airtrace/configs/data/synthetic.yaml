# @package _global_

data:
  root: data/
  dataset_name: "synthetic"
  train_index: "metadata/synthetic_train_index.parquet"
  val_index: "metadata/synthetic_val_index.parquet"
  test_index: "metadata/synthetic_test_index.parquet"

  window:
    input_len: 128
    pred_len: 16
    stride: 16
    target_sensors: ["signal_0", "signal_1", "signal_2"]

  sensors:
    use: ["signal_0", "signal_1", "signal_2", "signal_3", "signal_4"]

  static_features:
    use: []
