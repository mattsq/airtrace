# @package _global_

model:
  name: holt_winters
  params:
    season_length: 24  # Number of steps per seasonal cycle
    alpha: 0.3         # Level smoothing parameter (0 < alpha <= 1)
    beta: 0.1          # Trend smoothing parameter (0 < beta <= 1)
    gamma: 0.1         # Seasonal smoothing parameter (0 < gamma <= 1)
    seasonal: additive # Seasonal type: additive or multiplicative
