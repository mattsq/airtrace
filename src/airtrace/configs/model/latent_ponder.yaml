# @package _global_

model:
  name: latent_ponder
  params:
    base_model:
      name: gru_ar
      params:
        hidden_size: 96
        num_layers: 1
        dropout: 0.05
    hidden_dim: 128
    max_steps: 6
    min_steps: 1
    ponder_penalty: 0.01
    aux_weight: 0.0
    halt_bias: 0.0
    max_eval_steps: 4
    dropout: 0.1
